site_name: Treelang
site_description: Generate, validate, inspect, and execute AST programs with model providers.
site_url: https://cs0lar.github.io/treelang/
repo_url: https://github.com/cs0lar/treelang
repo_name: csolar/treelang
edit_uri: edit/dev/docs/

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mike:
      canonical_version: latest
      version_selector: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Guides:
      - Command-line interface: cli.md
      - Downstream testing kit: testing.md
      - JSON Schema and editor validation: json-schema.md
      - End-to-end cookbooks: cookbooks.md
      - Extensions and provider contributions: extensions.md
      - Tree transformations: tree-transformations.md
      - Recursive programs: recursive-programs.md
      - Structured model output: structured-output.md
      - OpenAI Responses API: openai-responses.md
      - Tool input validation: tool-input-validation.md
      - Execution resilience and replay: execution-resilience.md
  - Providers:
      - Capability negotiation: provider-capabilities.md
      - Anthropic: anthropic.md
      - Transport contracts: transport-contracts.md
      - Compatibility matrix: provider-matrix.md
  - Reference:
      - Supported API: api.md
      - Migration guide 1.0: migration-1.0.md
      - Migration guide 0.10: migration-0.10.md
  - Architecture decisions:
      - Schema versioning: adr/0001-schema-versioning.md
      - Execution semantics: adr/0002-execution-semantics.md
      - Provider contracts: adr/0003-provider-contracts.md
      - Recursive schema and execution: adr/0004-recursive-schema-and-execution.md

extra:
  version:
    provider: mike

copyright: Copyright &copy; Treelang contributors
