[project]
name = "treelang"
version = "0.10.2"
description = "LLM function calling on steroids using Abstract Syntax Trees."
authors = [
    { name = "csolar", email = "cristiano.solarino@brightminded.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "mcp>=1.28.1,<2",
    "openai>=1.68,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.104,<1"]

[project.scripts]
treelang = "treelang.cli:main"

[project.urls]
Homepage = "https://github.com/cs0lar/treelang"
Issues = "https://github.com/cs0lar/treelang/issues"
Documentation = "https://csolar.github.io/treelang/"

[dependency-groups]
dev = [
    "anthropic>=0.104,<1",
    "build>=1.4,<2",
    "hypothesis>=6.135,<7",
    "ipykernel>=6.29,<8",
    "mcp[cli]>=1.28.1,<2",
    "mike>=2.1,<3",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mypy>=1.19,<3",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "notebook>=7,<8",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.5,<5",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<0.17",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B017"]

[tool.mypy]
python_version = "3.12"
files = [
    "treelang",
    "evaluation/comparison.py",
    "evaluation/dataset.py",
    "evaluation/eval.py",
    "evaluation/live.py",
    "evaluation/live_eval.py",
    "evaluation/models.py",
    "evaluation/offline.py",
    "evaluation/runner.py",
    "scripts",
]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=treelang",
    "--cov=evaluation",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=60",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["treelang", "evaluation"]
omit = ["evaluation/data/tools.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
